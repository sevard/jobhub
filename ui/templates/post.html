<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publisher View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/ui/static/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/ui/static/fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/ui/static/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/ui/static/fav/favicon-16x16.png">
    <link rel="manifest" href="/ui/static/fav/site.webmanifest">
</head>

<body class="bg-light">
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Publisher View</h1>
                <p class="text-muted mb-0">Post a message</p>
            </div>
            <a class="btn btn-outline-secondary rounded-pill px-3" href="/"">&larr; Back</a>
        </div>

        <div class="card shadow-lg border-0 rounded-4 mb-4">
            <div class="card-body p-4">
                <div class="row g-2">

                    <div class="col-md-9">
                        <input id="messageInput" class="form-control rounded-pill px-4" placeholder="Type message">
                    </div>
                    <div class="col-md-3">
                        <button id="sendBtn" class="btn btn-primary rounded-pill w-100" type="button">Send</button>
                    </div>

                </div>
            </div>
        </div>

        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4">

                <h2 class="h5 mb-3">Your posted messages</h2>

                <!-- MESSAGES START -->
                <ul id="messages" class="list-group list-group-flush feed-list"></ul>
                <!-- MESSAGES END -->

                <template id="message-template">
                    <li class="list-group-item message-item d-flex justify-content-between align-items-center gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <span class="message-avatar" aria-hidden="true">&#128172;</span>
                            <span class="message-content text-break"></span>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3 delete-btn">Delete</button>
                    </li>
                </template>

            </div>
        </div>
    </div>

    <script src="/ui/static/post.js"></script>
</body>

</html>
