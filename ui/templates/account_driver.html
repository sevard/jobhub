{% extends "base.html" %}
{% block title %}JobHub - Driver Account{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Welcome, {{ user.username }}</h1>
            <p class="text-muted mb-0">Driver account.</p>
        </div>
        <form method="post" action="/account/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-outline-secondary rounded-pill px-3">Log out</button>
        </form>
    </div>

    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Want to earn? Browse the jobs posted!</h2>
            <p class="text-muted mb-4"></p>
            <a class="btn btn-primary rounded-pill px-4" href="/feed">View available jobs</a>
        </div>
    </div>
</div>
{% endblock %}
