<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobHub - Driver Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/static/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/ui/static/fav/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/ui/static/fav/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/ui/static/fav/favicon-16x16.png">
  <link rel="manifest" href="/ui/static/fav/site.webmanifest">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="mb-1">Welcome, {{ user.username }}</h1>
        <p class="text-muted mb-0">Driver account.</p>
      </div>
      <button type="button" id="logoutBtn" class="btn btn-outline-secondary rounded-pill px-3">Log out</button>
    </div>

    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Want to earn? Browse the jobs posted!</h2>
        <p class="text-muted mb-4"></p>
        <a class="btn btn-primary rounded-pill px-4" href="/feed">View available jobs</a>
      </div>
    </div>
  </div>
  <script src="/ui/static/account_page.js"></script>
</body>
</html>
