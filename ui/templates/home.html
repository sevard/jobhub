{% extends "base.html" %}
{% block title %}JobHub - Account{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Welcome, {{ user.username }}</h1>
            <p class="text-muted mb-0">Your account home page</p>
        </div>
        <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-outline-secondary rounded-pill px-3">Log out</button>
        </form>
    </div>
</div>
{% endblock %}
