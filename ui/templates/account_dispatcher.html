{% extends "base.html" %}
{% block title %}JobHub - Dispatcher Account{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Welcome, {{ user.username }}</h1>
            <p class="text-muted mb-0">Dispatcher</p>
        </div>
        <form method="post" action="/account/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-outline-secondary rounded-pill px-3">Log out</button>
        </form>
    </div>

    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Publish and manage jobs</h2>
            <p class="text-muted mb-4">Post new jobs and manage all posted jobs.</p>
            <a class="btn btn-primary rounded-pill px-4" href="/post">Broadcast Page</a>
        </div>
    </div>
</div>
{% endblock %}
