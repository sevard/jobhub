<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feed View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/ui/static/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/ui/static/fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/ui/static/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/ui/static/fav/favicon-16x16.png">
    <link rel="manifest" href="/ui/static/fav/site.webmanifest">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="feed-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="live-badge mb-2"><span class="live-dot"></span>Live</span>
                <h1 class="mb-1">Feed View</h1>
                <p class="text-muted mb-0">Messages posted by every connected user</p>
            </div>
            <a class="btn btn-outline-secondary rounded-pill px-3" href="/">&larr; Back</a>
        </div>

        <div class="card feed-card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">

                <!-- MESSAGES START -->
                <ul id="messages" class="list-group list-group-flush feed-list"> </ul>
                <!-- MESSAGES END -->

                <template id="message-template">
                    <li class="list-group-item message-item d-flex justify-content-between align-items-start gap-3 py-3">
                        <div class="d-flex gap-3 flex-grow-1">
                            <span class="message-avatar mt-1" aria-hidden="true">&#128663;</span>
                            <div class="message-content text-break">
                                <strong data-id="timeEl" class="d-block mb-1"></strong>
                                <div class="small">
                                    <span class="text-muted">From:</span> <span data-id="pickupEl" class="fw-medium"></span><br>
                                    <span class="text-muted">To:</span> <span data-id="dropoffEl" class="fw-medium"></span>
                                </div>
                                <div data-id="noteEl" class="text-muted small mt-1 fst-italic"></div>
                            </div>
                        </div>
                    </li>
                </template>
            </div>
        </div>
    </div>

    <script src="/ui/static/feed.js"></script>

</body>

</html>
