{% extends "base.html" %}
{% block title %} Available Jobs {% endblock %}
{% block content %}

<div class="container py-5">

    <div class="feed-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="live-badge mb-2"><span class="live-dot"></span>Live</span>
            <h1 class="mb-1">Available Jobs</h1>
            <p class="text-muted mb-0">do a job, earn some money!</p>
        </div>
        <a class="btn btn-outline-secondary rounded-pill px-3" href="/">&larr; Back</a>
    </div>

    <div class="card feed-card shadow-lg border-0 rounded-3">
        <div class="card-body p-4">
            <!-- MESSAGES START -->
            <ul id="messages" class="list-group list-group-flush feed-list"></ul>
            <p id="empty-state" class="text-muted text-center mb-0 py-4" hidden>No jobs available right now.</p>
            <!-- MESSAGES END -->

            <template id="message-template">
                <li class="list-group-item message-item d-flex justify-content-between align-items-start gap-3 py-3">
                    <div class="d-flex gap-3 flex-grow-1">
                        <span class="message-avatar mt-1" aria-hidden="true">&#128663;</span>
                        <div class="message-content text-break">
                            <strong data-field="time" class="d-block mb-1"></strong>
                            <div class="small">
                                <span class="text-muted">From:</span> <span data-field="pickup"
                                    class="fw-medium"></span><br>
                                <span class="text-muted">To:</span> <span data-field="dropoff" class="fw-medium"></span>
                            </div>
                            <div data-field="note" class="text-muted small mt-1 fst-italic"></div>
                        </div>
                    </div>
                </li>
            </template>

        </div> <!-- card-body -->
    </div> <!-- card feed-card -->

</div>
{% endblock %}
{% block scripts %}
<script src="/ui/static/feed.js"></script>
{% endblock %}
