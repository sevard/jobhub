<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}JobHub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/ui/static/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/ui/static/fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/ui/static/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/ui/static/fav/favicon-16x16.png">
    <link rel="manifest" href="/ui/static/fav/site.webmanifest">
    {% block head %}{% endblock %}
</head>

<body class="bg-light">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>

</html>
