[project]
name = "jobhub"
version = "0.1.0"
description = "lightweight ride-request board"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi-csrf-protect>=1.0.7",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
]

[tool.fastapi]
entrypoint = "api.main:app"
