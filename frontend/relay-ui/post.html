<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publisher View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Publisher View</h1>
                <p class="text-muted mb-0">Post a message</p>
            </div>
            <a class="btn btn-outline-secondary" href="index.html">Back</a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2">

                    <div class="col-md-9">
                        <input id="messageInput" class="form-control" placeholder="Type message">
                    </div>
                    <div class="col-md-3">
                        <button id="sendBtn" class="btn btn-outline-secondary w-100" type="button">Send</button>
                    </div>

                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <h2 class="h5">Your posted messages</h2>

                <!-- MESSAGES START -->
                <ul id="messages" class="message-list"></ul>
                <!-- MESSAGES END -->

            </div>
        </div>
    </div>

    <script src="post.js"></script>
</body>

</html>
