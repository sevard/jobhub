<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay Frontend</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Relay Frontend</h1>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-9">
            <label for="wsUrl" class="form-label">WebSocket URL</label>
            <input id="wsUrl" class="form-control" value="ws://127.0.0.1:8001/ws/" aria-label="WebSocket URL">
          </div>
          <div class="col-md-3">
            <button id="connectBtn" class="btn btn-primary w-100" type="button">Connect</button>
          </div>
        </div>
        <div id="status" class="mt-3 text-muted">Disconnected</div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-9">
            <input id="messageInput" class="form-control" placeholder="Type message">
          </div>
          <div class="col-md-3">
            <button id="sendBtn" class="btn btn-outline-secondary w-100" type="button">Send</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <ul id="messages" class="list-group list-group-flush"></ul>
      </div>
    </div>
  </div>

  <script>
    const wsUrlEl = document.getElementById("wsUrl");
    const connectBtn = document.getElementById("connectBtn");
    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const messagesEl = document.getElementById("messages");

    let ws = null;

    function addMessage(text) {
      const li = document.createElement("li");
      li.textContent = text;
      messagesEl.prepend(li);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function connect() {
      const url = wsUrlEl.value.trim();
      if (!url) {
        setStatus("Please provide a WebSocket URL");
        return;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }

      ws = new WebSocket(url);
      setStatus("Connecting...");

      ws.onopen = () => setStatus("Connected");
      ws.onclose = () => setStatus("Disconnected");
      ws.onerror = () => setStatus("Connection error");
      ws.onmessage = (event) => addMessage(event.data);
    }

    connectBtn.addEventListener("click", connect);

    sendBtn.addEventListener("click", () => {
      const value = inputEl.value.trim();
      if (!ws || ws.readyState !== WebSocket.OPEN || !value) {
        return;
      }
      ws.send(value);
      inputEl.value = "";
    });
  </script>
</body>
</html>
