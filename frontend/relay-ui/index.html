<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay Frontend</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="mb-1">Relay UI</h1>
        <p class="text-muted mb-0">Choose how you want to interact with the relay.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h4">Post &amp; View Your Messages</h2>
            <p class="text-muted">Send a message and see only the messages you posted.</p>
            <a class="btn btn-primary" href="post.html">Open publisher view</a>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h4">Live Feed</h2>
            <p class="text-muted">Watch all posted messages from every connected user.</p>
            <a class="btn btn-outline-secondary" href="feed.html">Open feed view</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
